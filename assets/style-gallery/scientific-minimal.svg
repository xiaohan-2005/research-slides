<svg width="1740" height="390" viewBox="0 0 1740 390" xmlns="http://www.w3.org/2000/svg">
<rect width="1740" height="390" fill="transparent"/>
<style>
  .paper{fill:#F8F7F2;stroke:#D9D7D0;stroke-width:1}
  .k{font:600 10px 'IBM Plex Mono','Consolas',monospace;letter-spacing:2px;fill:#315E8A}
  .h{font-family:'Source Serif 4','Georgia','Times New Roman',serif;fill:#111418}
  .b{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;fill:#404851}
  .m{font-family:'IBM Plex Mono','Consolas',monospace;fill:#6B7280}
