<svg width="1740" height="330" viewBox="0 0 1740 330" xmlns="http://www.w3.org/2000/svg">
<rect width="1740" height="330" fill="transparent"/>
<g transform="translate(0 12)"><rect width="540" height="304" rx="8" fill="#F3EFE6" stroke="#D5CDC1"/><text x="30" y="42" fill="#9F3F32" font-family="Consolas,monospace" font-size="10" letter-spacing="2">A READING OF THE TRANSFORMER</text><text x="30" y="120" fill="#231F1B" font-family="Georgia,serif" font-size="47" font-weight="700">Attention Is</text><text x="30" y="168" fill="#231F1B" font-family="Georgia,serif" font-size="47" font-weight="700">All You Need</text><line x1="30" y1="198" x2="190" y2="198" stroke="#9F3F32" stroke-width="2"/><text x="30" y="226" fill="#746A61" font-family="Segoe UI,Arial" font-size="13">Architecture, evidence, and what the paper actually claims</text><text x="30" y="278" fill="#746A61" font-family="Consolas,monospace" font-size="10">VASWANI ET AL. · 2017</text><text x="500" y="278" text-anchor="end" fill="#746A61" font-family="Consolas,monospace" font-size="10">01</text></g>
<g transform="translate(600 12)"><rect width="540" height="304" rx="8" fill="#F3EFE6" stroke="#D5CDC1"/><text x="30" y="42" fill="#9F3F32" font-family="Consolas,monospace" font-size="10" letter-spacing="2">ARGUMENT</text><text x="30" y="95" fill="#231F1B" font-family="Georgia,serif" font-size="32" font-weight="700">The design removes</text><text x="30" y="130" fill="#231F1B" font-family="Georgia,serif" font-size="32" font-weight="700">recurrence from the stack.</text><line x1="30" y1="154" x2="510" y2="154" stroke="#D5CDC1"/><text x="30" y="190" fill="#4F4740" font-family="Segoe UI,Arial" font-size="13">Self-attention routes dependencies directly across positions,</text><text x="30" y="210" fill="#4F4740" font-family="Segoe UI,Arial" font-size="13">while the encoder–decoder structure remains intact.</text><text x="360" y="190" fill="#9F3F32" font-family="Georgia,serif" font-size="17" font-style="italic">reported structure</text><text x="360" y="214" fill="#6D7458" font-family="Georgia,serif" font-size="17" font-style="italic">interpretation separated</text><text x="30" y="278" fill="#746A61" font-family="Consolas,monospace" font-size="10">SOURCE · §1–§3</text><text x="500" y="278" text-anchor="end" fill="#746A61" font-family="Consolas,monospace" font-size="10">02</text></g>
<g transform="translate(1200 12)"><rect width="540" height="304" rx="8" fill="#F3EFE6" stroke="#D5CDC1"/><text x="30" y="42" fill="#9F3F32" font-family="Consolas,monospace" font-size="10" letter-spacing="2">CONCLUSION</text><text x="30" y="90" fill="#231F1B" font-family="Georgia,serif" font-size="29" font-weight="700">Strong evidence, bounded claims.</text><rect x="30" y="126" width="142" height="96" fill="#FAF7F0" stroke="#D5CDC1"/><rect x="190" y="126" width="142" height="96" fill="#FAF7F0" stroke="#D5CDC1"/><rect x="350" y="126" width="142" height="96" fill="#FAF7F0" stroke="#D5CDC1"/><text x="44" y="150" fill="#9F3F32" font-family="Consolas,monospace" font-size="9">DEMONSTRATED</text><text x="44" y="176" fill="#231F1B" font-family="Segoe UI,Arial" font-size="12">attention-only</text><text x="44" y="193" fill="#231F1B" font-family="Segoe UI,Arial" font-size="12">transduction stack</text><text x="204" y="150" fill="#6D7458" font-family="Consolas,monospace" font-size="9">MEASURED</text><text x="204" y="176" fill="#231F1B" font-family="Segoe UI,Arial" font-size="12">WMT14 translation</text><text x="204" y="193" fill="#231F1B" font-family="Segoe UI,Arial" font-size="12">quality + training</text><text x="364" y="150" fill="#9F3F32" font-family="Consolas,monospace" font-size="9">NOT CLAIMED</text><text x="364" y="176" fill="#231F1B" font-family="Segoe UI,Arial" font-size="12">later historical</text><text x="364" y="193" fill="#231F1B" font-family="Segoe UI,Arial" font-size="12">impact</text><text x="30" y="278" fill="#746A61" font-family="Consolas,monospace" font-size="10">SOURCE · §7 · evidence boundary retained</text><text x="500" y="278" text-anchor="end" fill="#746A61" font-family="Consolas,monospace" font-size="10">03</text></g>
