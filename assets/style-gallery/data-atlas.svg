<svg width="1740" height="390" viewBox="0 0 1740 390" xmlns="http://www.w3.org/2000/svg">
<rect width="1740" height="390" fill="transparent"/>
<style>
 .paper{fill:#F4F5F2;stroke:#D7DCE0;stroke-width:1}
 .k{font:600 12px 'IBM Plex Mono','Consolas',monospace;letter-spacing:2px;fill:#315E8A}
 .h{font-family:'Manrope','Segoe UI',Arial,sans-serif;fill:#17202A;font-weight:700}
 .b{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;fill:#475467}
 .m{font-family:'IBM Plex Mono','Consolas',monospace;fill:#7B8794}
</style>
<g transform="translate(0 15)">
<rect class="paper" width="540" height="350" rx="6"/>
<text class="k" x="30" y="38">DATA ATLAS · RESEARCH REPORT</text>
<text class="h" x="30" y="112" font-size="48">Attention,</text>
<text class="h" x="30" y="160" font-size="48">measured</text>
<text class="b" x="30" y="194" font-size="15">Architecture claims linked to quantitative evidence.</text>
<line x1="30" y1="228" x2="490" y2="228" stroke="#D7DCE0"/>
<text class="m" x="30" y="253" font-size="13">BASE CONFIGURATION</text>
<text class="h" x="30" y="286" font-size="24" fill="#315E8A">h = 8</text>
<text class="h" x="160" y="286" font-size="24">d = 512</text>
<text class="h" x="330" y="286" font-size="24" fill="#2E7D64">d_ff = 2048</text>
<line x1="30" y1="307" x2="510" y2="307" stroke="#D7DCE0"/>
<text class="m" x="30" y="332" font-size="12">VASWANI ET AL. · SOURCE-MAPPED EXAMPLE</text>
